# Loopback URLs never resolve from CI runners, the package registry page
# answers 403 to automated traffic, and the WorkOS dashboard redirect-loops
# bots through its signin bootstrap — all remain valid in browsers, so they
# are excluded from automated link checking.
exclude = [
  "^http://localhost",
  "^https://www\\.npmjs\\.com/package/create-awesome-node-app",
  "^https://dashboard\\.workos\\.com",
]
