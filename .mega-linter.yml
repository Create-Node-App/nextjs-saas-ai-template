# MegaLinter configuration for Next.js SaaS AI Template
# More info at https://megalinter.io/latest/config-file/
# All available variables: https://megalinter.io/latest/config-file/
---
# ─── File Filters ─────────────────────────────────────────────────────────────

# Ignore generated and third-party directories (plus MegaLinter's own reports,
# so auto-fix runs never flag or re-lint their output)
FILTER_REGEX_EXCLUDE: >-
  (\.git/|node_modules/|\.next/|dist/|build/|coverage/|pnpm-lock\.yaml|megalinter-reports/)

# ─── Copy-Paste Detection (jscpd) ─────────────────────────────────────────────
# Template repositories have intentional structural duplication across features.
# Raise threshold to avoid false positives for boilerplate-style code.

COPYPASTE_JSCPD_ARGUMENTS: '--min-lines 20 --min-tokens 150 --threshold 5'

# ─── CSS (stylelint) ──────────────────────────────────────────────────────────
# Use the project's existing stylelint configuration

CSS_STYLELINT_CONFIG_FILE: .stylelintrc.json

# ─── DOCKERFILE (hadolint) ────────────────────────────────────────────────────

DOCKERFILE_HADOLINT_CONFIG_FILE: .hadolint.yaml

# ─── Spell Checking (cspell) ──────────────────────────────────────────────────

SPELL_CSPELL_CONFIG_FILE: cspell.json

# ─── TypeScript (ts-standard) ─────────────────────────────────────────────────
# ts-standard enforces standard.js style (no semicolons), which contradicts
# this repo's prettier config (semi: true) and flip-flops with lint-staged.
# TypeScript is linted by the repo ESLint + type-check CI jobs instead, so the
# whole TYPESCRIPT descriptor is disabled (per-linter DISABLE_ERRORS is
# ignored by MegaLinter and the check still fails).

DISABLE:
  - TYPESCRIPT

# ─── Repository Scanners ──────────────────────────────────────────────────────

# grype: Vulnerability scanner for dependencies.
# Many findings are in transitive devDependencies (storybook, build tools).
# Direct runtime vulnerabilities are patched via package updates.
# Disable hard errors so PRs can merge while advisories are tracked separately.
REPOSITORY_GRYPE_DISABLE_ERRORS: true

# trivy: Multi-purpose security scanner.
# Dockerfile HEALTHCHECK is present; disable hard errors for remaining advisories.
REPOSITORY_TRIVY_DISABLE_ERRORS: true
